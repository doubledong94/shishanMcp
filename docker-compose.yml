services:
  # ---- 主 MCP 容器：NestJS + nginx + Three.js 图页 ----
  shishan:
    build:
      context: .
      dockerfile: Dockerfile
      # 代理构建参数——只有设置了对应环境变量才会注入（构建阶段内 apk/npm/pip 联网用）
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        all_proxy: ${ALL_PROXY:-}
    image: shishan-mcp:local
    container_name: shishan-mcp
    # 同路径挂载：宿主机项目绝对路径 -> 容器内同一路径（容器内路径 = 宿主机路径），
    # 所以 AI 传宿主机绝对路径可直接读取，无需 HOST_CODE_ROOT 映射。
    # CODE_PROJECTS = 冒号分隔的项目绝对路径列表（目录名 = 项目名）。
    # 代码挂载只读（:ro），数据目录可写。
    volumes:
      # 项目卷由 deploy-graph.sh 生成的 override 注入（任意 N 个项目、同路径只读）
      - ${DATA_DIR:?设置 DATA_DIR=<宿主机数据目录>}:${DATA_DIR:?设置 DATA_DIR}
    environment:
      - NODE_ENV=production
      - MCP_SERVER_NAME=shishan-mcp-server
      # CODE_PROJECTS = 冒号分隔的项目绝对路径列表（目录名 = 项目名）。
      # 必填：deploy-graph.sh 传去重后的 PROJECT_LIST；直接用 compose 需自行设置。
      - CODE_PROJECTS=${PROJECT_LIST:?设置 PROJECT_LIST=<冒号分隔的项目绝对路径列表>}
      - DATA_ROOT=${DATA_DIR:?设置 DATA_DIR}
      # 代码图谱：scip 网关 + Neo4j 地址（走 compose 内部网络）
      - SCIP_URL=http://scip:8000
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?设置 NEO4J_PASSWORD=<neo4j 密码>}
      # 图谱 3D 页对外地址（query_graph 返回的 viewUrl 前缀）
      - GRAPH_VIEW_URL=http://localhost:18081
    ports:
      - "18080:80"   # MCP 调试控制台（工具调用日志）
      - "18081:82"   # 代码图谱 3D 页（Three.js）
      - "13000:3000" # MCP Server（LLM 客户端直连，Streamable HTTP @ /）
    depends_on:
      - scip
      - neo4j
    restart: unless-stopped

  # ---- scip 索引网关：生成 index.scip + 转 JSON ----
  scip:
    build:
      context: ./docker/scip
      dockerfile: Dockerfile
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        all_proxy: ${ALL_PROXY:-}
    image: shishan-scip:local
    container_name: shishan-scip
    volumes:
      # 与主容器同路径挂载同一批项目（只读）由 override 注入，产出写到共享 DATA_DIR
      - ${DATA_DIR:?设置 DATA_DIR}:${DATA_DIR:?设置 DATA_DIR}
      # Gradle 依赖缓存持久化：挂到容器 /home/scip/.gradle，容器重建不重复下载
      # （首次需重下依赖；init.d 的国内镜像脚本由 deploy-graph.sh 从 docker/scip/scip-repos.gradle 种子化）
      - ${DATA_DIR:?设置 DATA_DIR}/scip/gradle-home:/home/scip/.gradle
    environment:
      - SCIP_PROJECTS=${PROJECT_LIST:?设置 PROJECT_LIST}
      - SCIP_DATA_ROOT=${DATA_DIR:?设置 DATA_DIR}/scip
      - PORT=8000
      # 图数据库直写：scip-java fork（--scip-java 挂载）聚合期直写 Neo4j；
      # 内置官方版不消费这些变量，无影响。
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?设置 NEO4J_PASSWORD}
      - NEO4J_DATABASE=
    expose:
      - "8000"
    restart: unless-stopped

  # ---- Neo4j 图数据库：数据 bind mount 到宿主机，容器回收不丢 ----
  neo4j:
    image: neo4j:2026-community
    container_name: shishan-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?设置 NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_max__size=3G
      # 大批量图写入（fork 直写时 FLOWS 边可达数十万）默认事务内存上限不够，显式放宽
      - NEO4J_dbms_memory_transaction_total_max=2G
      - NEO4J_db_memory_transaction_max=1G
      # Neo4j 默认要求密码 >=8 位，允许自定义短密码（如本地测试用 6 位）
      - NEO4J_dbms_security_auth__minimum__password__length=4
    volumes:
      # bind mount：图数据库持久化在宿主机 DATA_DIR/neo4j，随容器重建/回收不丢
      - ${DATA_DIR:?设置 DATA_DIR}/neo4j/data:/data
      - ${DATA_DIR:?设置 DATA_DIR}/neo4j/logs:/logs
    ports:
      - "7474:7474"  # Neo4j Browser（调试用，可去掉）
      - "7687:7687"  # Bolt（调试用，可去掉）
    restart: unless-stopped