# 端口 80：MCP 调试控制台（工具调用日志 / 调用测试）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Web 前端（SPA 单页回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端控制台调用的后端 REST（与 MCP 工具共用同一套业务逻辑）
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 如果你想只暴露一个 80 端口、把 MCP 端点也走 nginx：
    # location /mcp {
    #     proxy_pass http://localhost:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    # }
    # 注意：MCP Streamable HTTP 端点是 "/"，与前端 SPA 冲突，所以默认
    # 走 3000 端口直连，不用 nginx 反代。
}

# 端口 82：代码图谱 3D 页（Three.js，query_graph 快照渲染）
server {
    listen 82;
    server_name _;
    root /usr/share/nginx/html-graph;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
