<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shishan MCP · 代码图谱 3D</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .panel {
        position: fixed; top: 12px; right: 12px; z-index: 10;
        background: rgba(13,17,23,0.85); border: 1px solid #30363d;
        border-radius: 8px; padding: 12px; width: 300px; font-size: 13px;
      }
      .panel h1 { font-size: 15px; margin-bottom: 8px; color: #e6edf3; }
      .panel label { display: block; margin: 6px 0 3px; color: #8b949e; }
      .panel input, .panel select, .panel textarea {
        width: 100%; background: #161b22; color: #c9d1d9;
        border: 1px solid #30363d; border-radius: 6px; padding: 6px;
        font-size: 13px;
      }
      .panel button {
        margin-top: 8px; width: 100%; padding: 8px;
        background: #238636; color: #fff; border: none; border-radius: 6px;
        cursor: pointer; font-size: 13px;
      }
      .panel button:hover { background: #2ea043; }
      .stats { margin-top: 8px; color: #58a6ff; font-size: 12px; }
      .error { margin-top: 8px; color: #f85149; font-size: 12px; }
      .hint { margin-top: 8px; color: #8b949e; font-size: 11px; line-height: 1.5; }
      .build { margin-top: 10px; color: #484f58; font-size: 10px; text-align: right; }
      .explore { margin-top: 12px; border-top: 1px solid #30363d; padding-top: 10px; }
      .explore h2 { font-size: 13px; margin-bottom: 6px; color: #e6edf3; }
      .sel { font-size: 12px; color: #f0883e; min-height: 16px; margin-bottom: 4px; word-break: break-all; }
      .panel button.secondary { background: #30363d; }
      .panel button.secondary:hover { background: #484f58; }
      .panel .view-ctrl { display: flex; gap: 8px; margin-top: 8px; }
      .panel .view-ctrl button { margin-top: 0; width: auto; flex: 1; font-size: 12px; }

      /* 标量查询结果（query_graph / 探索返回的非图数据） */
      .result-box { margin-top: 12px; border-top: 1px solid #30363d; padding-top: 8px; }
      .result-box h2 { font-size: 13px; margin-bottom: 4px; color: #e6edf3; }
      .result-box .result-rows {
        max-height: 28vh; overflow: auto; background: #161b22;
        border: 1px solid #30363d; border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      }
      .result-box .result-row {
        display: block; padding: 3px 8px; border-bottom: 1px solid #21262d;
        color: #c9d1d9; white-space: pre-wrap; word-break: break-all;
      }
      .result-box .result-row:last-child { border-bottom: none; }
      .result-box .result-row b { color: #58a6ff; font-weight: 600; }

      /* ---------- 顶部菜单栏（IDE 风格：标题 + 下拉 + 右侧快捷键） ---------- */
      .menubar {
        position: fixed; top: 0; left: 0; z-index: 60;
        display: flex; align-items: center; gap: 2px;
        background: #161b22; border-bottom: 1px solid #30363d;
        padding: 0 6px; height: 34px; font-size: 13px; user-select: none;
      }
      .menu { position: relative; }
      .menu-title {
        background: none; border: none; color: #c9d1d9;
        padding: 6px 12px; cursor: pointer; font-size: 13px; border-radius: 4px;
      }
      .menu-title:hover, .menu.open .menu-title { background: #21262d; color: #e6edf3; }
      .menu-dropdown {
        position: absolute; top: 100%; left: 0; min-width: 240px;
        background: #161b22; border: 1px solid #30363d; border-radius: 6px;
        padding: 4px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45);
      }
      .menu.open .menu-dropdown { display: block; }
      .menu-item {
        display: flex; align-items: center; justify-content: space-between; gap: 24px;
        width: 100%; background: none; border: none; color: #c9d1d9;
        padding: 6px 10px; text-align: left; font-size: 13px; cursor: pointer; border-radius: 4px;
      }
      .menu-item:hover { background: #1f6feb; color: #fff; }
      .menu-item .kbd {
        color: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; border: 1px solid #30363d; border-radius: 3px;
        padding: 0 6px; background: #0d1117; white-space: nowrap;
      }
      .menu-item:hover .kbd { color: #e6edf3; border-color: rgba(255,255,255,.5); background: #1f6feb; }

      /* ---------- 左侧代码查看器侧边栏 ---------- */
      .code-toggle {
        position: fixed; top: 44px; left: 0; z-index: 30;
        background: #238636; color: #fff; border: none; border-radius: 0 6px 6px 0;
        padding: 10px 8px; cursor: pointer; font-size: 13px; writing-mode: vertical-rl;
        letter-spacing: 2px;
      }
      .code-toggle:hover { background: #2ea043; }
      .code-panel {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
        width: 460px; max-width: 92vw;
        background: #0d1117; border-right: 1px solid #30363d;
        display: flex; flex-direction: column; font-size: 13px;
        transition: transform 0.2s ease;
      }
      .code-panel.closed { transform: translateX(-100%); }
      .code-header {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        border-bottom: 1px solid #30363d; background: #161b22;
      }
      .code-header h2 { font-size: 14px; color: #e6edf3; flex: 1; }
      .code-header .icon-btn {
        background: #30363d; color: #c9d1d9; border: none; border-radius: 4px;
        padding: 4px 8px; cursor: pointer; font-size: 13px;
      }
      .code-header .icon-btn:hover { background: #484f58; }
      .code-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .code-proj { padding: 8px 12px; border-bottom: 1px solid #21262d; }
      .code-proj label { color: #8b949e; font-size: 12px; margin-right: 6px; }
      .code-proj select {
        width: 100%; background: #161b22; color: #c9d1d9;
        border: 1px solid #30363d; border-radius: 6px; padding: 5px; font-size: 13px;
      }
      .code-tree-wrap { flex: 0 0 38%; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid #21262d; }
      .tree-tools {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px;
      }
      .tree-tools .tree-title { font-size: 12px; color: #8b949e; white-space: nowrap; }
      .code-tree-wrap input {
        flex: 1; background: #161b22; color: #c9d1d9;
        border: 1px solid #30363d; border-radius: 6px; padding: 5px 8px; font-size: 12px;
      }
      .code-tree-wrap input:focus { outline: none; border-color: #58a6ff; }
      .tree { flex: 1; overflow: auto; padding: 4px 6px 8px; font-size: 12.5px; }
      .tree .trow {
        display: flex; align-items: center; gap: 5px; padding: 3px 8px;
        border-radius: 5px; white-space: nowrap; cursor: pointer;
        border-left: 2px solid transparent; color: #c9d1d9;
      }
      .tree .trow:hover { background: #161b22; }
      .tree .trow .chev {
        flex: none; width: 14px; text-align: center; color: #8b949e; font-size: 10px;
        opacity: 0.85;
      }
      .tree .trow .dot {
        flex: none; width: 7px; height: 7px; border-radius: 50%;
        background: #6e7681; margin: 0 3px;
      }
      .tree .dir-row .name { font-weight: 600; color: #d29922; }
      .tree .dir-row .dot { background: #d29922; border-radius: 2px; width: 9px; height: 9px; }
      .tree .dir-row.root .name { color: #e6edf3; }
      .tree .file-row .name { color: #c9d1d9; }
      .tree .file-row:hover .name { color: #e6edf3; }
      .tree .file-row.selected { background: #1f6feb22; border-left-color: #58a6ff; }
      .tree .file-row.selected .name { color: #79c0ff; }
      .tree .trow .name { overflow: hidden; text-overflow: ellipsis; }
      .tree .tree-empty { color: #8b949e; padding: 10px; font-size: 12px; }
      .code-viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .code-toolbar {
        display: flex; align-items: center; gap: 6px; padding: 6px 12px;
        border-bottom: 1px solid #21262d; flex-wrap: wrap;
      }
      .code-toolbar .cursor-info { font-size: 12px; color: #8b949e; flex: 1; min-width: 120px; }
      .code-toolbar .cursor-info b { color: #f0883e; }
      .code-toolbar button {
        background: #238636; color: #fff; border: none; border-radius: 5px;
        padding: 5px 10px; cursor: pointer; font-size: 12px;
      }
      .code-toolbar button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
      .code-toolbar button:hover:not(:disabled) { background: #2ea043; }
      .code-toolbar button.secondary { background: #30363d; color: #c9d1d9; }
      .code-toolbar button.secondary:hover { background: #484f58; }
      .code {
        flex: 1; overflow: auto; margin: 0; user-select: text; cursor: text;
      }
      .code .code-line {
        display: flex; line-height: 1.55; width: max-content; min-width: 100%;
      }
      .code .ln {
        flex: none; width: 48px; text-align: right; padding-right: 10px;
        color: #484f58; user-select: none; background: #0d1117;
      }
      .code .txt { white-space: pre; padding-right: 16px; }
      .code .code-line.found { background: #3a2d12; }
      .code .code-line.actCursor { background: #1f6feb22; }
      .tok-kw { color: #ff7b72; }
      .tok-str { color: #a5d6ff; }
      .tok-com { color: #8b949e; font-style: italic; }
      .tok-num { color: #79c0ff; }
      .tok-fn { color: #d2a8ff; }
      .tok-type { color: #7ee787; }
      .tok-def { color: #ffa657; }
      .locate { border-top: 1px solid #21262d; max-height: 40%; overflow: auto; background: #161b22; }
      .locate-header { padding: 6px 12px; color: #8b949e; font-size: 12px; }
      .locate-empty { padding: 8px 12px; color: #f85149; font-size: 12px; }
      .locate-row {
        display: flex; align-items: center; gap: 6px; padding: 4px 12px;
        cursor: pointer; border-top: 1px solid #21262d; font-size: 12px;
      }
      .locate-row:hover { background: #21262d; }
      .locate-row.in-graph { background: #1f6feb1a; }
      .locate-badge {
        flex: none; padding: 1px 6px; border-radius: 4px; font-size: 11px;
        color: #0d1117; font-weight: 600; min-width: 74px; text-align: center;
      }
      .locate-row .locate-name { font-weight: 600; color: #e6edf3; }
      .locate-row .locate-meta { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- 顶部菜单栏（IDE 风格） -->
    <nav id="menubar" class="menubar">
      <div class="menu" id="menu-graph">
        <button class="menu-title" data-menu="menu-graph" title="图谱操作">上色</button>
        <div class="menu-dropdown">
          <button class="menu-item" id="mi-flow-color">按流自动上色<span class="kbd">Ctrl+H</span></button>
          <button class="menu-item" id="mi-clear-color">清除所有上色<span class="kbd">Ctrl+Alt+8</span></button>
        </div>
      </div>
    </nav>

    <div class="panel">
      <h1>代码图谱 3D</h1>
      <label for="project">项目</label>
      <select id="project"></select>
      <label for="view">已保存视图</label>
      <select id="view"><option value="">— 实时跟随当前工作图 —</option></select>
      <button id="view-btn">加载并渲染</button>
      <div class="stats" id="stats"></div>
      <div class="error" id="error"></div>
      <div class="result-box" id="result-box" hidden>
        <h2>查询结果</h2>
        <div class="result-rows" id="result-rows"></div>
      </div>
      <div class="explore">
        <h2>探索</h2>
        <div id="sel" class="sel">未选中节点</div>
        <label for="dir">沿方向扩展</label>
        <select id="dir">
          <option value="FLOWS">FLOWS 数据流</option>
          <option value="CALLS">CALLS 调用</option>
          <option value="REF">REF 类嵌套</option>
          <option value="CONTROLS">CONTROLS 逻辑控制</option>
          <option value="NEXT">NEXT 执行顺序</option>
          <option value="ARG_OF">ARG_OF 实参归属</option>
          <option value="SCOPED_BY">SCOPED_BY 作用域</option>
        </select>
        <button id="expand-btn" disabled>向选中节点扩展</button>
        <button id="reset-btn" class="secondary">重置为当前视图</button>
        <div class="view-ctrl">
          <button id="mode-btn" class="secondary">切到 3D</button>
          <button id="layout-btn" class="secondary">暂停布局</button>
        </div>
      </div>
      <div class="hint">
        2D：左键拖拽平移 / 滚轮缩放 / 中键绕 Z 旋转。3D：拖拽轨道旋转。
        单击节点选中（半透明→变亮并显示标签）、双击平滑聚焦、
        右键让边沿流光脉冲级联。选中后可沿方向（数据流/调用/嵌套/控制/顺序）扩展。
      </div>
      <div class="build" id="build"></div>
    </div>

    <!-- 左侧代码查看器（可折叠侧边栏） -->
    <button id="code-toggle" class="code-toggle" title="打开代码查看器">代码</button>
    <div id="code-panel" class="code-panel closed">
      <div class="code-header">
        <h2>代码查看器</h2>
        <button id="code-collapse" class="icon-btn" title="折叠侧边栏">◂</button>
      </div>
      <div class="code-body">
        <div class="code-proj">
          <select id="code-project"></select>
        </div>
        <div class="code-tree-wrap">
          <div class="tree-tools">
            <span class="tree-title">文件</span>
            <input id="tree-filter" type="text" placeholder="过滤文件名…" />
          </div>
          <div id="tree" class="tree">
            <div class="tree-empty">选择项目后加载目录树</div>
          </div>
        </div>
        <div class="code-viewer">
          <div class="code-toolbar">
            <span id="cursor-info" class="cursor-info">点击代码定位光标符号</span>
            <button id="locate-btn" disabled>定位 Neo4j 节点</button>
            <button id="clear-locate-btn" class="secondary" disabled>清除高亮</button>
          </div>
          <div id="code" class="code" tabindex="0"></div>
          <div id="locate-results" class="locate" hidden></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
